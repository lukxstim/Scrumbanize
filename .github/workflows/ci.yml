# Tests and type checks for every push to main and every pull request (US-20). Linux only: it is the cheapest
# runner, and the code under test does not depend on the platform. The desktop builds run in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No install scripts: better-sqlite3 ships prebuilt binaries for every platform and prefers them, so nothing
      # needs to be compiled (the same as a local install with npm's default script policy).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  # The Docker setup (US-23): Caddyfile and Compose files are valid, and the image works end to end, in the local
  # setup and hardened as in docker-compose.yml (see .github/scripts/docker-smoke.sh).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Caddyfile is valid
        run: >-
          docker run --rm -e DOMAIN=scrumbanize.example.org -e ACME_EMAIL=ci@example.org
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.local.yml config --quiet
      - name: Local setup works end to end
        run: bash .github/scripts/docker-smoke.sh local
      - name: Hardened app container of docker-compose.yml works
        run: bash .github/scripts/docker-smoke.sh production
      - name: Logs
        if: failure()
        run: |
          docker compose -f docker-compose.local.yml logs || true
          docker compose logs || true
