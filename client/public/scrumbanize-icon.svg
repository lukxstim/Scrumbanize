<!-- The emblem of scrumbanize.svg without the wordmark, cropped to a square: app logo and favicon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="114 54 272 272" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Hintergrund (1:1 abgerundet) -->
  <rect x="114" y="54" width="272" height="272" rx="56" fill="url(#bgGrad)" />

  <!-- Emblem (Zentriert) -->
  <g transform="translate(250, 190)">
    <!-- Äußerer Kreis & Wachstums-Pfeil -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-dasharray="550" stroke-dashoffset="120" stroke-linecap="round" transform="rotate(-45)" />
    <path d="M 75 -75 L 110 -75 L 110 -40" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Kanban Spalten / Cards -->
    <g transform="translate(-45, -45)">
      <!-- Spalte 1 -->
      <rect x="0" y="10" width="22" height="70" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="3" />
      <rect x="5" y="20" width="12" height="12" rx="3" fill="#06b6d4" opacity="0.8" />
      <rect x="5" y="38" width="12" height="25" rx="3" fill="#06b6d4" opacity="0.4" />

      <!-- Spalte 2 (Highlight) -->
      <rect x="34" y="0" width="22" height="90" rx="6" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="3" />
      <rect x="39" y="12" width="12" height="15" rx="3" fill="#3b82f6" />
      <rect x="39" y="33" width="12" height="35" rx="3" fill="#3b82f6" opacity="0.6" />

      <!-- Spalte 3 -->
      <rect x="68" y="15" width="22" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="3" />
      <rect x="73" y="25" width="12" height="30" rx="3" fill="#10b981" />
    </g>
  </g>
</svg>
